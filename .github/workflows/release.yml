name: Build release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tag-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install packaging tools
        run: |
          dart pub global activate fastforge 0.6.12
          npm install --global appdmg@0.6.6

      - name: Build macOS DMG
        run: dart pub global run fastforge:main package --platform macos --targets dmg

      - name: Rename macOS DMG
        run: |
          dmg_file=$(find dist -type f -name '*.dmg' -print -quit)
          test -n "$dmg_file"
          mv "$dmg_file" "Songxia-macOS-${GITHUB_REF_NAME}.dmg"

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/松匣.app Songxia-macOS-${GITHUB_REF_NAME}.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Songxia-macOS-${{ github.ref_name }}
          path: |
            Songxia-macOS-${{ github.ref_name }}.dmg
            Songxia-macOS-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastforge
        run: dart pub global activate fastforge 0.6.12

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup checksum mismatch: $actualHash"
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          $innoPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path (Join-Path $innoPath 'ISCC.exe'))) {
            throw 'Inno Setup installation failed'
          }
          "INNO_SETUP_PATH=$innoPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: dart pub global run fastforge:main package --platform windows --targets exe

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*.exe' -Recurse)
          if ($installers.Count -ne 1) {
            throw "Expected one installer, found $($installers.Count)"
          }
          Move-Item -Path $installers[0].FullName -Destination "Songxia-Windows-${env:GITHUB_REF_NAME}-Setup.exe"

      - name: Rename Windows executable
        shell: pwsh
        run: Rename-Item -Path build/windows/x64/runner/Release/pine_vault.exe -NewName "Songxia.exe"

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Songxia-Windows-${env:GITHUB_REF_NAME}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Songxia-Windows-${{ github.ref_name }}
          path: |
            Songxia-Windows-${{ github.ref_name }}-Setup.exe
            Songxia-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release without code signing
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/松匣.app Songxia-iOS-${GITHUB_REF_NAME}.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Songxia-iOS-${{ github.ref_name }}
          path: Songxia-iOS-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/pinevault-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=pinevault-release.jks
          EOF

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "Songxia-Android-${GITHUB_REF_NAME}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Songxia-Android-${{ github.ref_name }}
          path: Songxia-Android-${{ github.ref_name }}.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-ios
      - build-android
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 松匣 ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/**/*
